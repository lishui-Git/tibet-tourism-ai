<?xml version="1.0" encoding="UTF-8"?>
<!--
  原创矢量插画：布达拉宫（红山之上的白红宫 + 金顶 + 暮色天空）
  全手写 SVG，无第三方素材。以"暖色暮光 + 冷色山体"的对比衬托宫殿。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="布达拉宫：红山之上的宫殿插画">
  <defs>
    <linearGradient id="bd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123a5e"/>
      <stop offset="46%" stop-color="#4f7fa0"/>
      <stop offset="78%" stop-color="#c99a6e"/>
      <stop offset="100%" stop-color="#e8c79c"/>
    </linearGradient>
    <linearGradient id="bd-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4a3a"/>
      <stop offset="100%" stop-color="#38251d"/>
    </linearGradient>
    <linearGradient id="bd-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#efe6d6"/>
      <stop offset="100%" stop-color="#c9b99e"/>
    </linearGradient>
    <linearGradient id="bd-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8493d"/>
      <stop offset="100%" stop-color="#7d2b24"/>
    </linearGradient>
    <linearGradient id="bd-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d97a"/>
      <stop offset="100%" stop-color="#c9992c"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#bd-sky)"/>

  <!-- 远处雪山剪影 -->
  <path d="M0 246 L96 190 L168 230 L262 168 L350 236 L430 196 L520 250 L600 210 L640 244 L640 420 L0 420 Z"
        fill="#3d6480" opacity="0.55"/>

  <!-- 红山（台地：上窄下宽，托住宫殿） -->
  <path d="M188 420 L206 268 L434 268 L452 420 Z" fill="url(#bd-hill)"/>
  <path d="M206 268 L434 268 L428 256 L212 256 Z" fill="#8a6350"/>

  <!-- 宫殿：白宫两翼 + 红宫居中 + 金顶 -->
  <g>
    <!-- 白宫左翼（两级台阶式） -->
    <rect x="214" y="196" width="66"  height="60" fill="url(#bd-white)"/>
    <rect x="222" y="176" width="50"  height="22" fill="url(#bd-white)"/>
    <rect x="214" y="192" width="66"  height="5"  fill="#a4907a"/>
    <rect x="222" y="172" width="50"  height="5"  fill="#a4907a"/>
    <!-- 白宫右翼 -->
    <rect x="360" y="196" width="66"  height="60" fill="url(#bd-white)"/>
    <rect x="368" y="176" width="50"  height="22" fill="url(#bd-white)"/>
    <rect x="360" y="192" width="66"  height="5"  fill="#a4907a"/>
    <rect x="368" y="172" width="50"  height="5"  fill="#a4907a"/>
    <!-- 红宫（最高、居中） -->
    <rect x="280" y="152" width="80"  height="104" fill="url(#bd-red)"/>
    <rect x="280" y="146" width="80"  height="8"   fill="url(#bd-gold)"/>
    <!-- 金顶与宝瓶 -->
    <path d="M292 146 L320 128 L348 146 Z" fill="url(#bd-gold)"/>
    <rect x="314" y="112" width="12" height="18" fill="url(#bd-gold)"/>
    <circle cx="320" cy="108" r="5" fill="#ffe9a8"/>
    <!-- 檐口装饰线 -->
    <rect x="280" y="184" width="80" height="4" fill="#5f1f19" opacity="0.55"/>
  </g>

  <!-- 窗洞（规律排布，体现"宫"的结构感） -->
  <g fill="#2b2119" opacity="0.8">
    <rect x="290" y="164" width="10" height="13"/><rect x="308" y="164" width="10" height="13"/>
    <rect x="326" y="164" width="10" height="13"/><rect x="344" y="164" width="10" height="13"/>
    <rect x="290" y="200" width="10" height="13"/><rect x="308" y="200" width="10" height="13"/>
    <rect x="326" y="200" width="10" height="13"/><rect x="344" y="200" width="10" height="13"/>
    <rect x="290" y="234" width="10" height="13"/><rect x="308" y="234" width="10" height="13"/>
    <rect x="326" y="234" width="10" height="13"/><rect x="344" y="234" width="10" height="13"/>
    <rect x="226" y="208" width="9"  height="12"/><rect x="246" y="208" width="9" height="12"/>
    <rect x="226" y="236" width="9"  height="12"/><rect x="246" y="236" width="9" height="12"/>
    <rect x="372" y="208" width="9"  height="12"/><rect x="392" y="208" width="9" height="12"/>
    <rect x="372" y="236" width="9"  height="12"/><rect x="392" y="236" width="9" height="12"/>
  </g>

  <!-- 之字形登宫盘道 -->
  <g stroke="#d8c7ad" stroke-width="2.2" opacity="0.7" fill="none">
    <path d="M300 256 L292 282 L340 292 L332 320 L382 330 L374 360"/>
  </g>

  <!-- 山脚经幡（一处点缀） -->
  <g transform="translate(150 300)">
    <path d="M0 0 L0 44" stroke="#e7e0d2" stroke-width="1.8"/>
    <path d="M0 6 L78 30" stroke="#e7e0d2" stroke-width="1.3" opacity="0.9"/>
    <rect x="8"  y="8"  width="12" height="17" fill="#2f6fa5" opacity="0.94" transform="rotate(17 14 16)"/>
    <rect x="36" y="18" width="12" height="17" fill="#f2f6f8" opacity="0.94" transform="rotate(17 42 26)"/>
    <rect x="62" y="27" width="12" height="17" fill="#b3352f" opacity="0.94" transform="rotate(17 68 35)"/>
  </g>
</svg>
