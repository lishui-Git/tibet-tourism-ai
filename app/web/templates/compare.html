{% extends "base.html" %}
{% block title %}景点对比 · 西藏旅游景点智能评价与分析系统{% endblock %}
{% block subtitle %}M4 景点对比：指标差异由系统计算，解读为可选的在线生成{% endblock %}

{% block content %}
<section class="card">
  <h2>选择两个景点进行对比</h2>
  <p class="hint">
    对比的<strong>指标差异、比率、样本量比全部由后端计算</strong>；"解读"需要在线模型，
    当前默认关闭（不产生任何模型费用）。数据部分不受影响，始终可用。
  </p>
  <p class="hint">
    <select id="cmp-a"><option value="">— 景点 A —</option></select>
    <span class="vs">对比</span>
    <select id="cmp-b"><option value="">— 景点 B —</option></select>
    <button id="btn-compare" type="button">开始对比</button>
    <button id="btn-cmp-reset" type="button" class="ghost">清空</button>
  </p>
  <div id="cmp-body"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/compare.js') }}"></script>
{% endblock %}
