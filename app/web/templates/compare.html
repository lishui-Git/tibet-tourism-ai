{% extends "base.html" %}
{% block title %}景点对比 · 西藏旅游景点智能评价与分析系统{% endblock %}
{% block subtitle %}逐项对照两个景点的游客评价{% endblock %}

{% block content %}
<section class="card">
  <h2>选择两个景点进行对比</h2>
  <p class="hint">
    系统会逐项对照两个景点的评论量、平均评分、好评率、差评率、情感分布与游客关注的方面，
    并标出差距。请选择两个<strong>不同</strong>的景点。
  </p>
  <p class="hint cmp-picker">
    <select id="cmp-a" aria-label="景点 A"><option value="">— 景点 A —</option></select>
    <span class="vs">对比</span>
    <select id="cmp-b" aria-label="景点 B"><option value="">— 景点 B —</option></select>
    <button id="btn-compare" type="button">开始对比</button>
    <button id="btn-cmp-reset" type="button" class="ghost">清空</button>
  </p>
  <div id="cmp-body"></div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/compare.js') }}"></script>
{% endblock %}
